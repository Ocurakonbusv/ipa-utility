name: IPA Shooter
options:
  bundleIdPrefix: com.ocurakonbusv
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  IPA Shooter:
    type: application
    platform: iOS
    sources:
      - path: GameApp.swift
      - path: GameView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ocurakonbusv.ipashooter
        INFOPLIST_KEY_CFBundleDisplayName: IPA Shooter
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
